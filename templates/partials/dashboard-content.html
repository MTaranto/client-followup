{{define "dashboard-content.html"}}
<div id="dashboard-content">
    {{template "dashboard-metrics.html" .}}

    <form id="client-lookup" class="filter-bar no-print"
        hx-get="/followups/new" hx-target="#modal-container" hx-swap="innerHTML">
        <label class="field grow">
            <span>Cliente</span>
            <input id="dashboard-client-search" type="search" name="client_name"
                placeholder="Digite o nome do cliente" autocomplete="off"
                hx-get="/clients/search" hx-target="#client-search-results" hx-swap="innerHTML"
                hx-trigger="input queue:last, search queue:last">
        </label>
        <button class="button primary align-end" type="submit">Buscar</button>
    </form>
    <div id="client-search-results" class="client-search-results no-print" aria-live="polite"></div>

    {{template "dashboard-results.html" .}}
</div>
{{end}}
