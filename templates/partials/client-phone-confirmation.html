{{define "client-phone-confirmation.html"}}
{{with .}}
<div class="phone-confirmation" role="alert">
    <p><strong>{{.Name}}</strong> já possui cadastro com:</p>
    <p class="phone-comparison">{{if .CurrentPhone}}{{.CurrentPhone}}{{else}}Sem telefone cadastrado{{end}}</p>
    <p>O telefone informado agora é:</p>
    <p class="phone-comparison">{{.SubmittedPhone}}</p>
    <div class="phone-confirmation-actions">
        <button type="button" class="button secondary" data-phone-change-action="update">
            Atualizar telefone deste cliente
        </button>
        <button type="button" class="button ghost" data-phone-change-action="new_client">
            Cadastrar outro cliente com este nome
        </button>
    </div>
</div>
{{end}}
{{end}}
