{{define "followup-form.html"}}
<div class="modal-overlay" role="presentation">
    <section class="modal-content wide" role="dialog" aria-modal="true" aria-labelledby="followup-form-title">
        <header class="modal-header">
            <div><p class="eyebrow">Cadastro</p><h2 id="followup-form-title">Nova pendência</h2></div>
            <button type="button" class="icon-button modal-close" aria-label="Fechar">×</button>
        </header>
        <form id="followup-form" class="form-grid" hx-post="/followups" hx-target="#followup-form-message" hx-swap="innerHTML">
            <div class="full-width">
                <input type="hidden" name="client_id" id="client-id" value="{{if .ClientID}}{{.ClientID}}{{end}}">
                <input type="hidden" name="phone_change_action" id="phone-change-action">
                <input type="hidden" name="client_resolution" id="client-resolution" value="{{if .Resolved}}existing{{end}}">
                <label class="field">
                    <span>Cliente *</span>
                    <input id="client-name" name="client_name" value="{{.ClientName}}" required autocomplete="off" autofocus
                        placeholder="Digite o nome completo"
                        {{if .ClientID}}data-selected-client-name="{{.ClientName}}"{{end}}>
                </label>
            </div>
            <div id="client-match-choice" class="client-match-choice full-width" aria-live="polite"></div>
            <fieldset id="followup-fields" class="followup-fields full-width" {{if not .Resolved}}disabled{{end}}>
                <label class="field full-width">
                    <span>Telefone *</span>
                    <input id="client-contact" name="contact" value="{{.Contact}}" data-phone-input required autocomplete="tel" inputmode="numeric"
                        pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000"
                        title="Informe um celular com DDD no formato (00) 00000-0000"
                        hx-get="/clients/phone-change-confirmation" hx-trigger="change"
                        hx-target="#phone-change-confirmation" hx-swap="innerHTML" hx-include="closest form"
                        {{if .ClientID}}data-autofilled-contact="{{.Contact}}"{{end}}>
                </label>
                <div id="phone-change-confirmation" class="full-width" aria-live="polite"></div>
                <label class="field">
                    <span>Data de início *</span>
                    <input type="date" name="start_date" value="{{.Today}}" required>
                </label>
                <label class="field">
                    <span>Data limite *</span>
                    <input type="date" name="due_date" required>
                </label>
                <label class="field">
                    <span>Prioridade *</span>
                    <select name="priority" required>
                        <option value="HIGH">Alta</option>
                        <option value="MEDIUM" selected>Média</option>
                        <option value="LOW">Baixa</option>
                    </select>
                </label>
                <label class="field full-width">
                    <span>Descrição *</span>
                    <textarea name="description" rows="3" required></textarea>
                </label>
                <label class="field full-width">
                    <span>Encaminhar para</span>
                    <input name="forward_to" autocomplete="off">
                </label>
                <label class="field full-width">
                    <span>Observação</span>
                    <textarea name="notes" rows="3" aria-describedby="privacy-note"></textarea>
                    <small id="privacy-note">Use apenas informações administrativas. Não registre dados clínicos ou médicos.</small>
                </label>
                <div id="followup-form-message" class="full-width" aria-live="polite"></div>
            </fieldset>
            <footer class="form-actions full-width">
                <button type="button" class="button ghost modal-close">Cancelar</button>
                <button id="followup-save" type="submit" class="button primary" {{if not .Resolved}}disabled{{end}}>Salvar pendência</button>
            </footer>
        </form>
    </section>
</div>
{{end}}
